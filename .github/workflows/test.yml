name: Fable source CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  source:
    name: "source-${{ matrix.os }}-py${{ matrix.python }}"
    runs-on: "${{ matrix.os }}"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '${{ matrix.python }}'
      - name: Install and import check
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m compileall -q fable_mode fable_engine fable_v2
          python -c "import fable_mode, fable_v2; from fable_engine import server; print(fable_mode.__version__)"
      - name: Canonical V1 suite
        run: python fable_engine/test_server.py
      - name: Canonical V2 and packaging/security suites
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate packaging definition
        run: python -c "from pathlib import Path; assert Path('packaging/fable_mode.spec').is_file(); assert 'pyinstaller==' in Path('requirements-build.txt').read_text()"
      - name: Validate shell wrapper and dry-run
        if: "${{ runner.os != 'Windows' }}"
        shell: bash
        run: |
          sh -n install.sh
          ./install.sh --dry-run --yes
      - name: Validate PowerShell syntax
        if: "${{ runner.os == 'Windows' }}"
        shell: pwsh
        run: |
          $errors = @(); foreach ($path in @('install.ps1', 'install-antigravity.ps1')) {
            $tokens = $null; $parse = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $path), [ref]$tokens, [ref]$parse) | Out-Null
            $errors += $parse
          }
          if ($errors.Count -gt 0) { $errors | Format-List *; exit 1 }
          & ./install.ps1 -DryRun -Yes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
