name: Fable tagged release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  build:
    name: "artifact-${{ matrix.artifact }}"
    runs-on: "${{ matrix.os }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x86_64
          - os: macos-13
            artifact: macos-x86_64
          - os: macos-14
            artifact: macos-arm64
          - os: windows-latest
            artifact: windows-x86_64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'
      - name: Build pinned self-contained runtime
        run: |
          python -m pip install -r requirements-build.txt
          python build_scripts/build_release.py
      - name: Frozen executable smoke test (POSIX)
        if: "${{ runner.os != 'Windows' }}"
        shell: bash
        run: |
          set -eu
          archive=$(find dist -maxdepth 1 \( -name '*.tar.gz' -o -name '*.zip' \) | head -1)
          rm -rf smoke home; mkdir -p smoke home/bin
          case "$archive" in *.tar.gz) tar -xzf "$archive" -C smoke;; *.zip) unzip -q "$archive" -d smoke;; esac
          cat > home/fake-mcp.py <<'PY'
          import json, os, pathlib, sys
          host = sys.argv[1]; args = sys.argv[2:]
          profile = pathlib.Path(os.environ.get('HOME') or os.environ['USERPROFILE'])
          # Antigravity is file-backed at its real global config path;
          # Claude/Codex retain their fake CLI state under HOME.
          state = (profile / '.gemini' / 'config' / 'mcp_config.json'
                   if host == 'agy' else profile / (host + '.json'))
          data = json.loads(state.read_text()) if state.exists() else {}
          if args == ['--version']:
              print('fake'); raise SystemExit(0)
          if args[:2] == ['mcp', 'list']:
              print(json.dumps(data)); raise SystemExit(0)
          if args[:2] == ['mcp', 'remove']:
              name = args[2]
              if name not in data:
                  print('No MCP server named ' + name, file=sys.stderr); raise SystemExit(2)
              del data[name]; state.write_text(json.dumps(data)); raise SystemExit(0)
          if args[:2] == ['mcp', 'add']:
              marker = args.index('--'); name = args[marker - 1]
              data[name] = {'command': args[marker + 1], 'args': args[marker + 2:]}
              state.write_text(json.dumps(data)); raise SystemExit(0)
          raise SystemExit(4)
          PY
          py=$(command -v python3)
          for h in claude codex; do printf '#!/bin/sh\nexec %s "$PWD/home/fake-mcp.py" %s "$@"\n' "$py" "$h" > "home/bin/$h"; chmod 700 "home/bin/$h"; printf '{}\n' > "home/$h.json"; done
          printf '#!/bin/sh\nexec %s "$PWD/home/fake-mcp.py" agy "$@"\n' "$py" > home/bin/agy; chmod 700 home/bin/agy
          export HOME="$PWD/home" USERPROFILE="$PWD/home" XDG_CONFIG_HOME="$PWD/home/.config" FABLE_DATA_DIR="$PWD/home/data" PATH="$PWD/home/bin:$PATH"
          exe="$PWD/smoke/fable-mode"
          "$exe" install --yes --register-hosts --install-dir "$PWD/home/install"
          for h in claude codex; do
            python3 - "$PWD/home/$h.json" <<'PY'
          import json, sys
          assert 'fable-engine' in json.load(open(sys.argv[1]))
          PY
          done
          python3 - "$PWD/home/.gemini/config/mcp_config.json" <<'PY'
          import json, sys
          state = json.load(open(sys.argv[1]))
          assert 'fable-engine' in state['mcpServers']
          PY
          "$exe" verify --install-dir "$PWD/home/install"
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' | "$exe" serve --state-dir "$PWD/home/data" | grep -q '"id": 1'
          # Replacement without registration must retain ownership metadata;
          # the next uninstall still cleans the original registrations.
          "$exe" install --yes --install-dir "$PWD/home/install"
          python3 - "$PWD/home/.gemini/config/mcp_config.json" <<'PY'
          import json, sys
          assert 'fable-engine' in json.load(open(sys.argv[1]))['mcpServers']
          PY
          "$exe" install --yes --register-hosts --install-dir "$PWD/home/install"
          for h in claude codex; do
            python3 - "$PWD/home/$h.json" <<'PY'
          import json, sys
          assert 'fable-engine' in json.load(open(sys.argv[1]))
          PY
          done
          python3 - "$PWD/home/.gemini/config/mcp_config.json" <<'PY'
          import json, sys
          assert 'fable-engine' in json.load(open(sys.argv[1]))['mcpServers']
          PY
          "$exe" uninstall --yes --install-dir "$PWD/home/install"
          for h in claude codex; do
            python3 - "$PWD/home/$h.json" <<'PY'
          import json, sys
          state = json.load(open(sys.argv[1]))
          assert 'fable-engine' not in state and 'fable-mode' not in state
          PY
          done
          test ! -e "$PWD/home/.gemini/config/mcp_config.json"
      - name: Frozen executable smoke test (Windows)
        if: "${{ runner.os == 'Windows' }}"
        shell: pwsh
        run: |
          $home = Join-Path $PWD 'smoke-home'; New-Item -ItemType Directory -Force $home | Out-Null
          $bin = Join-Path $home 'bin'; New-Item -ItemType Directory -Force $bin | Out-Null
          $fake = @'
          import json, os, pathlib, sys
          host = sys.argv[1]; args = sys.argv[2:]
          profile = pathlib.Path(os.environ.get('HOME') or os.environ['USERPROFILE'])
          # Antigravity is file-backed at its real global config path;
          # Claude/Codex retain their fake CLI state under HOME.
          state = (profile / '.gemini' / 'config' / 'mcp_config.json'
                   if host == 'agy' else profile / (host + '.json'))
          data = json.loads(state.read_text()) if state.exists() else {}
          if args == ['--version']:
              print('fake'); raise SystemExit(0)
          if args[:2] == ['mcp', 'list']:
              print(json.dumps(data)); raise SystemExit(0)
          if args[:2] == ['mcp', 'remove']:
              name = args[2]
              if name not in data:
                  print('No MCP server named ' + name, file=sys.stderr); raise SystemExit(2)
              del data[name]; state.write_text(json.dumps(data)); raise SystemExit(0)
          if args[:2] == ['mcp', 'add']:
              marker = args.index('--'); name = args[marker - 1]
              data[name] = {'command': args[marker + 1], 'args': args[marker + 2:]}
              state.write_text(json.dumps(data)); raise SystemExit(0)
          raise SystemExit(4)
          '@
          Set-Content -Path (Join-Path $home 'fake-mcp.py') -Value $fake
          $py = (Get-Command python).Source
          foreach ($name in @('claude', 'codex')) {
            '{}' | Set-Content (Join-Path $home "$name.json")
            Set-Content -Path (Join-Path $bin "$name.cmd") -Value "@echo off`r`n`"$py`" `"$home\\fake-mcp.py`" $name %*"
          }
          Set-Content -Path (Join-Path $bin 'agy.cmd') -Value "@echo off`r`n`"$py`" `"$home\\fake-mcp.py`" agy %*"
          $env:HOME = $home; $env:USERPROFILE = $home; $env:XDG_CONFIG_HOME = (Join-Path $home '.config')
          $env:FABLE_DATA_DIR = (Join-Path $home 'data'); $env:Path = "$bin;$env:Path"
          $exe = Join-Path $PWD 'dist\fable-mode.exe'; $install = Join-Path $home 'install'
          & $exe install --yes --register-hosts --install-dir $install; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($name in @('claude', 'codex')) {
            $state = Get-Content (Join-Path $home "$name.json") | ConvertFrom-Json
            if (-not $state.'fable-engine') { exit 1 }
          }
          $agyConfig = Join-Path $home '.gemini\config\mcp_config.json'
          if (-not (Test-Path $agyConfig)) { exit 1 }
          $agyState = Get-Content $agyConfig | ConvertFrom-Json
          if (-not $agyState.mcpServers.'fable-engine') { exit 1 }
          & $exe verify --install-dir $install; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' | & $exe serve --state-dir (Join-Path $home 'data') | Select-String '"id": 1' | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Replacement without registration must retain ownership metadata.
          & $exe install --yes --install-dir $install; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path $agyConfig)) { exit 1 }
          & $exe install --yes --register-hosts --install-dir $install; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($name in @('claude', 'codex')) {
            $state = Get-Content (Join-Path $home "$name.json") | ConvertFrom-Json
            if (-not $state.'fable-engine') { exit 1 }
          }
          $agyState = Get-Content $agyConfig | ConvertFrom-Json
          if (-not $agyState.mcpServers.'fable-engine') { exit 1 }
          & $exe uninstall --yes --install-dir $install; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($name in @('claude', 'codex')) {
            $state = Get-Content (Join-Path $home "$name.json") | ConvertFrom-Json
            if ($state.'fable-engine' -or $state.'fable-mode') { exit 1 }
          }
          if (Test-Path $agyConfig) { exit 1 }
      - name: Publish per-artifact archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: "fable-mode-${{ matrix.artifact }}"
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release
      - name: Assemble unique release assets
        shell: bash
        run: |
          set -eu
          mkdir -p upload
          find release -type f \( -name '*.zip' -o -name '*.tar.gz' \) -exec cp {} upload/ \;
          cat release/*/SHA256SUMS > upload/SHA256SUMS
      - name: Create GitHub Release (unsigned artifacts, checksums attached)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          test -n "${GITHUB_REF_NAME}"
          gh release create "${GITHUB_REF_NAME}" upload/* --title "Fable Mode ${GITHUB_REF_NAME}" --generate-notes

