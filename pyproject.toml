[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fable-engine"
version = "1.2.0"
description = "Independent deterministic System 2 cognitive engine and mechanical time-lock MCP server"
readme = "README.md"
authors = [{ name = "REX-codebase" }]
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
# Package-aware portable installer/runtime. The legacy entries remain stable.
fable-mode = "fable_mode.launcher:main"
fable-engine = "fable_engine.server:main"
fable-v1 = "fable_engine.server:main"
fable-v2-broker = "fable_v2.execution_broker:main"

[tool.setuptools.package-data]
fable_mode = ["resources.json", "LICENSE"]
fable_engine = ["fable_session.json"]

[tool.setuptools]
py-modules = ["fable_mode_entry"]

[tool.setuptools.packages.find]
include = ["fable_mode*", "fable_engine*", "fable_v2*"]


