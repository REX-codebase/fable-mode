<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <!-- Light logo for dark mode -->
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e0e0e0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Circuit lines -->
  <g stroke="#e0e0e0" stroke-width="1.5" fill="none">
    <path d="M40 80 L40 120 L30 130" />
    <path d="M40 100 L25 100" />
    <path d="M40 140 L30 150" />
    <circle cx="30" cy="130" r="2" fill="#e0e0e0"/>
    <circle cx="25" cy="100" r="2" fill="#e0e0e0"/>
    <circle cx="30" cy="150" r="2" fill="#e0e0e0"/>
  </g>
  <!-- Main F shape with 3D effect -->
  <path d="M70 40 L110 40 L110 60 L90 60 L90 90 L110 90 L110 110 L90 110 L90 160 L70 160 Z" fill="#ffffff"/>
  <path d="M110 40 L140 30 L140 50 L120 60 Z" fill="#cccccc"/>
  <path d="M110 60 L120 60 L120 90 L110 90 Z" fill="#cccccc"/>
  <path d="M110 90 L130 80 L130 100 L110 110 Z" fill="#cccccc"/>
  <!-- Blue accent -->
  <path d="M90 110 L110 110 L110 130 L90 130 Z" fill="#00aaff"/>
  <circle cx="95" cy="120" r="3" fill="#00d4ff"/>
  <!-- Text -->
  <text x="100" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">FABLE MODE</text>
  <text x="55" y="200" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#00aaff">▲</text>
</svg>