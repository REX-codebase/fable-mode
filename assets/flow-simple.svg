<svg xmlns="http://www.w3.org/2000/svg" width="720" height="180" viewBox="0 0 720 180">
  <defs>
    <linearGradient id="warmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c1a12"/>
      <stop offset="100%" stop-color="#1a100b"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3d281c"/>
      <stop offset="100%" stop-color="#2a1b13"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offset"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.25"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="720" height="180" rx="16" fill="url(#warmBg)"/>
  
  <!-- Step 1 -->
  <g filter="url(#soft)">
    <rect x="30" y="40" width="140" height="100" rx="12" fill="url(#card)" stroke="#5c3d2e" stroke-width="1"/>
    <text x="100" y="75" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#e8d5b7">Think</text>
    <text x="100" y="100" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#a8907a">Time-locked</text>
    <text x="100" y="118" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#a8907a">deliberation</text>
  </g>
  
  <!-- Arrow 1 -->
  <path d="M180 90 L220 90" stroke="#8b5e3c" stroke-width="2" fill="none"/>
  <polygon points="220,90 210,85 210,95" fill="#8b5e3c"/>
  
  <!-- Step 2 -->
  <g filter="url(#soft)">
    <rect x="230" y="40" width="140" height="100" rx="12" fill="url(#card)" stroke="#5c3d2e" stroke-width="1"/>
    <text x="300" y="75" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#e8d5b7">Prove</text>
    <text x="300" y="100" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#a8907a">Evidence &amp; </text>
    <text x="300" y="118" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#a8907a">receipts</text>
  </g>
  
  <!-- Arrow 2 -->
  <path d="M380 90 L420 90" stroke="#8b5e3c" stroke-width="2" fill="none"/>
  <polygon points="420,90 410,85 410,95" fill="#8b5e3c"/>
  
  <!-- Step 3 -->
  <g filter="url(#soft)">
    <rect x="430" y="40" width="140" height="100" rx="12" fill="url(#card)" stroke="#5c3d2e" stroke-width="1"/>
    <text x="500" y="75" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#e8d5b7">Attack</text>
    <text x="500" y="100" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#a8907a">Red-team</text>
    <text x="500" y="118" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#a8907a">swarm</text>
  </g>
  
  <!-- Arrow 3 -->
  <path d="M580 90 L620 90" stroke="#8b5e3c" stroke-width="2" fill="none"/>
  <polygon points="620,90 610,85 610,95" fill="#8b5e3c"/>
  
  <!-- Step 4 -->
  <g filter="url(#soft)">
    <rect x="630" y="40" width="60" height="100" rx="12" fill="url(#card)" stroke="#5c3d2e" stroke-width="1"/>
    <text x="660" y="95" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#e8d5b7">Write</text>
  </g>
</svg>